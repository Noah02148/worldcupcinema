<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldCupCinema — game day &amp; movie night!</title>
  <link rel="preconnect" href="https://docs.google.com" />
  <link rel="preconnect" href="https://image.tmdb.org" />
  <link rel="stylesheet" href="./css/styles.css?v=20260613b" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="brand">
        <span class="brand-mark">▶</span>
        <span class="brand-text">
          <span class="brand-name">WorldCupCinema</span>
          <span class="brand-slogan">game day &amp; movie night!</span>
        </span>
      </a>

      <nav class="tabs" aria-label="stage">
        <a href="#/" class="tab" data-tab="group" data-i18n="tab_group_stage">小组赛</a>
        <a href="#/knockout" class="tab" data-tab="knockout" data-i18n="tab_knockout">淘汰赛</a>
        <a href="#/standings" class="tab" data-tab="standings" data-i18n="tab_standings">积分榜</a>
      </nav>

      <a href="#/" class="today-nav" aria-label="today's matches">
        <svg class="today-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        <span data-i18n="today_matches">今日比赛</span>
      </a>

      <a href="#contact" class="contact-nav" aria-label="contact">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" />
        </svg>
        <span data-i18n="contact">影片投稿</span>
      </a>

      <div class="lang-switch" role="group" aria-label="language">
        <button class="lang-btn" data-lang="zh">中</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main id="app" class="app">
    <div class="loading" data-i18n="loading">加载中…</div>
  </main>

  <footer id="contact" class="contact">
    <h2 class="contact-head" data-i18n="contact">影片投稿</h2>
    <p class="contact-body" data-i18n="contact_body"></p>
    <a class="contact-email" href="mailto:fangzhouhe68@gmail.com">fangzhouhe68@gmail.com</a>
  </footer>

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="./js/i18n.js?v=20260613b"></script>
  <script src="./js/dev-posters.js?v=20260613b"></script><!-- TEMP: local poster previews; remove once Sheet poster_url is filled -->
  <script src="./js/data.js?v=20260613b"></script>
  <script src="./js/predictions.js?v=20260613b"></script>
  <script src="./js/app.js?v=20260613b"></script>
</body>
</html>
